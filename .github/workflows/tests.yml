name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Qt headless runtime dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1
      - name: Install uv
        run: pip install uv
      - name: Run test suite
        run: uv run --extra gui python -m unittest discover -s tests -v
      - name: Build package
        run: |
          pip install build
          python -m build

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Run test suite
        run: uv run --extra gui python -m unittest discover -s tests -v
      - name: Run GUI smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run --extra gui python tools/gui_smoke_test.py

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Lint critical syntax errors
        run: uv run --no-project --with ruff ruff check src tests --select E9
      - name: Type-check recent public API boundaries
        run: >-
          uv run --no-project --with mypy mypy
          src/starsector_variant_generator/analysis/campaign_save_discovery.py
          src/starsector_variant_generator/analysis/fleet_advisory_boundaries.py
          --follow-imports=skip --no-error-summary

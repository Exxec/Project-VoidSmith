name: Portable release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install uv
      - name: Build and smoke-test portable Windows x64 archive
        run: powershell -ExecutionPolicy Bypass -File tools\build_portable_release.ps1 -BootstrapDependencies -Clean
      - uses: actions/upload-artifact@v4
        with:
          name: VoidSmith-windows-x64
          path: |
            dist/VoidSmith-*-win-x64.zip
            dist/VoidSmith-*-win-x64.zip.sha256
          if-no-files-found: error

  package-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv and Qt headless runtime dependency
        run: |
          python -m pip install uv
          sudo apt-get update
          sudo apt-get install -y libegl1
      - name: Build and smoke-test portable Linux x64 archive
        run: bash tools/build_portable_release_linux.sh --bootstrap-dependencies --clean
      - uses: actions/upload-artifact@v4
        with:
          name: VoidSmith-linux-x64
          path: |
            dist/VoidSmith-*-linux-x64.tar.gz
            dist/VoidSmith-*-linux-x64.tar.gz.sha256
          if-no-files-found: error

  publish-tagged-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package-windows-x64, package-linux-x64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$TAG" =~ (alpha|beta|rc) ]]; then
            RELEASE_FLAGS="--prerelease"
          else
            RELEASE_FLAGS=""
          fi

          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              $RELEASE_FLAGS \
              --generate-notes
          fi

          # Upload all assets to the release
          for file in release-assets/*; do
            if [ -f "$file" ]; then
              gh release upload "$TAG" "$file" --repo "$GITHUB_REPOSITORY" --clobber
            fi
          done
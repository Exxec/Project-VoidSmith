[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voidsmith"
version = "0.2.0"
description = "VoidSmith: read-only Starsector variant analysis and generation"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.11"

[project.urls]
Homepage = "https://github.com/Exxec/Project-VoidSmith"
Issues = "https://github.com/Exxec/Project-VoidSmith/issues"

[project.scripts]
voidsmith = "starsector_variant_generator.cli.main:main"
voidsmith-gui = "starsector_variant_generator.gui.app:main"
# Compatibility aliases retained for existing local workflows.
svg = "starsector_variant_generator.cli.main:main"
svg-gui = "starsector_variant_generator.gui.app:main"

[project.optional-dependencies]
gui = ["PySide6>=6.6"]

[dependency-groups]
# Release tooling is locked with the project rather than supplied through an
# ad-hoc ``uv run --with`` resolution.  Portable release builds therefore use
# only the committed lockfile and materialized local artifacts by default.
release = ["pyinstaller==6.22.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
# CI gate (docs/AUTOMATION_PLAN.md V0.4): syntax errors, pyflakes and bugbear. B008 stays off on purpose: every default call is a
# frozen dataclass or a Qt value type (docs/WORK_LOG.md 2026-08-31). TRY004 is not selected because the codebase raises ValueError
# for malformed external documents by convention.
select = ["E9", "F", "B"]
ignore = ["B008"]

[tool.mypy]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "starsector_variant_generator.gui.*"
# PySide6's shipped stubs do not expose several runtime-valid enum aliases
# (for example Qt.UserRole and QPainter.Antialiasing). Keep checking our own
# ordinary type errors while suppressing only those binding-stub categories.
disable_error_code = ["attr-defined"]
